<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Raadszaal van Achrona</title>
<style>
  :root { --paars: #2a1650; --rand: #e8dcff; --diep: #0b0614; --goud: #e8c45a; --tekst: #f4efff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--diep); color: var(--tekst);
    font-family: "Courier New", ui-monospace, monospace; }
  canvas#scherm { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; cursor: pointer; }
  .pixel { font-weight: 700; letter-spacing: .04em; text-shadow: 2px 2px 0 #000; }

  /* Bovenbalk */
  #kop { position: fixed; top: 0; left: 0; right: 0; display: flex; align-items: flex-start; gap: 16px; padding: 14px 18px; pointer-events: none; }
  #titel { font-size: clamp(14px, 1.6vw, 22px); color: var(--goud); }
  #titel small { display: block; font-size: .7em; color: #b9a8e6; margin-top: 2px; }
  #knoppen { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; pointer-events: auto; }
  #knoppen button, #knoppen a { font: inherit; font-size: 14px; font-weight: 700; color: var(--tekst); background: #1b1036cc; border: 2px solid #6a52a8;
    padding: 4px 10px; cursor: pointer; text-decoration: none; text-shadow: 1px 1px 0 #000; image-rendering: pixelated; }
  #knoppen button:hover, #knoppen a:hover { border-color: var(--rand); background: #2a1a52; }
  #knoppen .aan { border-color: var(--goud); color: var(--goud); }

  /* Beurtenteller */
  #teller { position: fixed; top: 64px; right: 18px; font-size: clamp(13px, 1.2vw, 17px); text-align: right; pointer-events: none; }
  #teller b { color: var(--goud); font-size: 1.5em; }

  /* Open vragen: briefje op perkament */
  #briefje { position: fixed; top: 74px; left: 18px; width: min(300px, 28vw); background: #e9d8ad; color: #3b2412;
    font-family: Georgia, "Times New Roman", serif; font-size: 12.5px; line-height: 1.3; padding: 10px 12px 8px; border: 3px solid #7a5428;
    box-shadow: 4px 4px 0 #000a; transform: rotate(-1.2deg); max-height: 46vh; overflow: auto; }
  #briefje h3 { margin: 0 0 6px; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; }
  #briefje ul { margin: 0; padding-left: 18px; }
  #briefje li { margin: 3px 0; }
  #briefje li.nieuw::after { content: " ✦ nieuw"; color: #a0300c; font-size: 11px; font-weight: 700; }
  #briefje li.af { text-decoration: line-through; opacity: .6; }
  #briefje .leeg { font-style: italic; opacity: .7; }
  @media (max-width: 800px) { #briefje { display: none; } }

  /* Tekstbox in rechtszaalstijl */
  #dialoog { position: fixed; left: 50%; bottom: 3vh; transform: translateX(-50%); width: min(1100px, 94vw); min-height: 23vh;
    background: linear-gradient(180deg, #221245f2, #0e0822f2); border: 4px solid var(--rand); outline: 3px solid #3a2266;
    box-shadow: 0 0 0 6px #000a, 0 10px 40px #000; padding: 22px 28px 26px; font-size: clamp(16px, 1.75vw, 25px); line-height: 1.4;
    transition: opacity .15s; }
  #dialoog.weg { opacity: 0; pointer-events: none; }
  #naambord { position: absolute; top: -1.75em; left: 16px; padding: 3px 16px; background: var(--kleur, #6a52a8);
    border: 3px solid var(--rand); color: #fff; font-size: .8em; text-transform: uppercase; }
  #naambord .pijl { opacity: .85; }
  #tekst { min-height: 3.6em; }
  #tekst.reden { font-style: italic; color: #d8ccf6; }
  #tekst.reden::before { content: "✦ "; color: var(--goud); font-style: normal; }
  #sub { margin-top: 10px; font-size: .72em; color: #cfc2f2; font-style: italic; opacity: 0; transition: opacity .3s; }
  #sub.zicht { opacity: 1; }
  #verder { position: absolute; right: 18px; bottom: 8px; color: var(--goud); animation: knip .8s steps(2) infinite; opacity: 0; }
  #verder.zicht { opacity: 1; }
  #pagina { position: absolute; right: 44px; bottom: 9px; font-size: .55em; color: #9a8ac8; }
  @keyframes knip { 50% { visibility: hidden; } }
  .id { display: inline-block; padding: 0 .25em; margin: 0 .05em; border-radius: 3px; background: color-mix(in srgb, var(--k) 30%, #000);
    color: #fff; border: 2px solid var(--k); font-size: .82em; line-height: 1.25; }

  /* Label boven een hoofd (toolcalls) */
  .label { position: fixed; transform: translate(-50%, -100%); background: #0e0822ee; border: 2px solid var(--k, #e8dcff); color: #fff;
    padding: 3px 10px; font-size: clamp(12px, 1.1vw, 16px); white-space: nowrap; pointer-events: none; transition: opacity .2s; }
  .label::after { content: ""; position: absolute; left: 50%; bottom: -9px; margin-left: -6px; border: 6px solid transparent; border-top-color: var(--k, #e8dcff); }

  /* Uitroep bij geschillen */
  #uitroep { position: fixed; left: 50%; top: 40%; transform: translate(-50%, -50%) rotate(-6deg) scale(0); font-size: clamp(48px, 9vw, 140px);
    font-weight: 900; font-style: italic; color: #fff3c4; -webkit-text-stroke: 4px #5a0a14; text-shadow: 6px 6px 0 #5a0a14, 0 0 40px #ff3b3b;
    pointer-events: none; padding: .1em .5em; background: radial-gradient(closest-side, #ff4a2acc, #c8102e99 60%, transparent);
    transition: transform .18s cubic-bezier(.2, 1.8, .4, 1); }
  #uitroep.zicht { transform: translate(-50%, -50%) rotate(-6deg) scale(1); }
  .schud { animation: schud .35s; }
  @keyframes schud { 20% { translate: -10px 4px; } 40% { translate: 8px -6px; } 60% { translate: -6px 3px; } 80% { translate: 4px -2px; } }

  /* Finale: het Verdict op een perkamentrol */
  #finale { position: fixed; inset: 0; display: grid; place-items: center; background: #05020acc; opacity: 0; pointer-events: none; transition: opacity .6s; }
  #finale.zicht { opacity: 1; pointer-events: auto; }
  #rol { width: min(860px, 92vw); max-height: 86vh; overflow: auto; background: #ead9ae; color: #2e1a0c; font-family: Georgia, serif;
    border: 6px double #7a5428; box-shadow: 0 0 0 4px #3b2412, 0 20px 80px #000; padding: 26px 34px; transform: scaleY(.02); transform-origin: top;
    transition: transform .9s cubic-bezier(.2, .9, .3, 1); }
  #finale.zicht #rol { transform: scaleY(1); }
  #rol h2 { margin: 0 0 4px; text-align: center; letter-spacing: .12em; text-transform: uppercase; font-size: 22px; }
  #rol .onder { text-align: center; font-style: italic; margin-bottom: 14px; opacity: .75; }
  #rol h3 { margin: 14px 0 4px; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: #6a3a10; }
  #rol .deel { margin: 8px 0; }
  #rol .meter { height: 10px; background: #00000022; border: 1px solid #00000044; margin-top: 4px; position: relative; }
  #rol .meter i { position: absolute; inset: 0 auto 0 0; background: var(--k); }
  #rol .zeker { font-size: 12px; opacity: .8; }
  #rol .id { font-family: "Courier New", monospace; font-size: 12px; color: #fff; }
  #rol ol { margin: 4px 0; padding-left: 22px; }
  #rol { position: relative; }
  #rol { padding-top: 120px !important; }
  #rol .zegel { position: absolute; top: 14px; left: 50%; margin-left: -48px; width: 96px; height: 96px; border-radius: 50%; display: grid; place-items: center;
    background: radial-gradient(circle at 40% 35%, #d8343a, #8a0c14 70%); color: #ffd9c0; font-family: Georgia, serif; font-weight: 700;
    font-size: 15px; letter-spacing: .08em; box-shadow: 0 0 0 5px #a3121c, 3px 4px 0 6px #0005; transform: rotate(-14deg) scale(3); opacity: 0; }
  #finale.zicht #rol .zegel { animation: zegel .35s cubic-bezier(.5, 0, .8, .4) 1.2s forwards; }
  @keyframes zegel { to { transform: rotate(-14deg) scale(1); opacity: 1; } }
  #rol .sluit { display: block; margin: 16px auto 0; font: inherit; padding: 6px 16px; background: #3b2412; color: #ead9ae; border: 0; cursor: pointer; }


  /* Modus: LIVE of HERHALING */
  #modus { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); font-size: clamp(14px, 1.4vw, 20px); padding: 4px 16px;
    border: 3px solid currentColor; background: #0b0614dd; pointer-events: none; letter-spacing: .12em; }
  #modus.live { color: #ff5a5a; } #modus.herhaling { color: var(--goud); } #modus.fout { color: #ff7a7a; }
  #modus.live::before { content: "● "; animation: knip 1s steps(2) infinite; }
  /* Foutmelding bij status "fout" */
  #fout { position: fixed; top: 56px; left: 50%; transform: translateX(-50%); width: min(760px, 92vw); background: #3a0a12f0; color: #ffe0e0;
    border: 3px solid #ff6a6a; padding: 10px 16px; font-size: 15px; display: none; z-index: 5; }
  #fout.zicht { display: block; }
  /* Onderzoeksbord (doelen van de Koning) */
  #bord { display: flex; flex-wrap: wrap; gap: 4px; margin: 0 0 8px; }
  #bord span { font-family: "Courier New", monospace; font-size: 11px; font-weight: 700; padding: 1px 6px; border: 2px solid #7a5428; background: #f4e8c8; }
  #bord span.onderbouwd { background: #2f7a3a; color: #fff; border-color: #1f5a2a; }
  #bord span.onbeslist { background: #c07a10; color: #fff; border-color: #8a5208; }
  #bord span.nu { outline: 3px solid #a0300c; }
  /* Bewijskaarten (bronverwijzingen van het Raadslid) */
  #kaarten { position: fixed; right: 18px; top: 118px; width: min(340px, 30vw); max-height: calc(70vh - 130px); overflow: hidden; display: flex; flex-direction: column; gap: 7px; pointer-events: none; }
  #kaarten .kop { font-family: "Courier New", monospace; font-weight: 700; font-size: 12px; color: #e8dcff; letter-spacing: .06em; text-shadow: 1px 1px 0 #000; }
  .kaart { background: #f3e6c4; color: #2e1a0c; border: 3px solid var(--k); box-shadow: 3px 3px 0 #000a; padding: 6px 9px; font-family: Georgia, serif;
    font-size: 13px; line-height: 1.3; text-shadow: none; flex-shrink: 0; transform: translateX(120%); transition: transform .35s cubic-bezier(.2, 1.4, .4, 1); }
  .kaart.in { transform: translateX(0); }
  .kaart .bk { font-family: "Courier New", monospace; font-size: 11px; color: #5a3a20; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin: 2px 0 3px; }
  .kaart .id { font-family: "Courier New", monospace; font-size: 12px; color: #fff; border-radius: 0; }
  @media (max-width: 900px) { #kaarten { display: none; } }

  /* Intro: gordijn en startscherm */
  #gordijn { position: fixed; inset: 0; z-index: 20; pointer-events: none; }
  #gordijn .doek { position: absolute; top: 0; bottom: 0; width: 51%; pointer-events: auto;
    background: repeating-linear-gradient(90deg, #4a0410 0 6px, #7a0a1e 6px 22px, #9a1228 22px 30px, #6a0818 30px 44px);
    box-shadow: inset 0 -16px 0 #c9a040, inset 0 -22px 0 #6a4a10; transition: transform 1.9s cubic-bezier(.6, .05, .3, 1); }
  #gordijn .links { left: 0; } #gordijn .rechts { right: 0; }
  #gordijn .kap { position: absolute; left: 0; right: 0; top: 0; height: 10vh; border-bottom: 8px solid #c9a040;
    background: repeating-linear-gradient(90deg, #5a0614 0 30px, #8a0e24 30px 60px); transition: transform 1.9s cubic-bezier(.6, .05, .3, 1); }
  #gordijn.open .links { transform: translateX(-102%); } #gordijn.open .rechts { transform: translateX(102%); }
  #gordijn.open .kap { transform: translateY(-115%); } #gordijn.open .doek { pointer-events: none; }
  #startscherm { position: fixed; inset: 0; z-index: 21; display: grid; place-content: center; gap: 18px; text-align: center; transition: opacity .5s; }
  #startscherm.weg { opacity: 0; pointer-events: none; }
  #startscherm h1 { margin: 0; color: var(--goud); font-size: clamp(30px, 5.5vw, 72px); text-shadow: 5px 5px 0 #000; letter-spacing: .06em; }
  #startscherm p { margin: 0; color: #f0dcc0; font-size: clamp(14px, 1.4vw, 20px); text-shadow: 2px 2px 0 #000; }
  #startscherm button { justify-self: center; font: inherit; font-weight: 700; font-size: clamp(16px, 1.6vw, 22px); color: #2e1a0c; background: var(--goud);
    border: 4px solid #fff3c4; outline: 3px solid #3b2412; padding: 10px 26px; cursor: pointer; text-shadow: none; animation: puls 1.4s ease-in-out infinite; }
  @keyframes puls { 50% { transform: scale(1.06); } }
  #startscherm button:hover { animation: none; background: #fff3c4; }
  #laden { position: fixed; inset: 0; display: grid; place-items: center; font-size: 20px; color: var(--goud); background: var(--diep); }
</style>
<script type="importmap">{ "imports": { "three": "/zaal/vendor/three.module.min.js" } }</script>
</head>
<body>
<canvas id="scherm"></canvas>

<div id="kop">
  <div id="titel" class="pixel">RAADSZAAL VAN ACHRONA<small id="status">wachten op trace.json…</small></div>
  <div id="knoppen" class="pixel">
    <button id="k-opnieuw" title="Opnieuw afspelen vanaf het begin">⏮ Opnieuw</button>
    <button id="k-pauze" title="Pauze (P)">⏸</button>
    <button id="k-volgende" title="Volgende stap (→)">⏭</button>
    <button id="k-tempo" title="Afspeelsnelheid">1×</button>
    <button id="k-kort" title="Kort: lange getuigenissen ingekort · Volledig: alles">Kort</button>
    <button id="k-live" title="Spring naar de laatste stand">● Live</button>
    <button id="k-geluid" title="Geluid aan/uit">🔇</button>
    <a href="/" title="De gewone debatviewer">Debatviewer ↗</a>
  </div>
</div>
<div id="modus" class="pixel"></div>
<div id="fout" class="pixel"></div>
<div id="teller" class="pixel"></div>
<div id="kaarten"></div>

<div id="briefje"><h3>Onderzoek van de Koning</h3><div id="bord"></div><h3>Open vragen</h3><div id="vragen"><span class="leeg">Nog geen open vragen.</span></div></div>

<div id="dialoog" class="pixel weg">
  <div id="naambord"></div>
  <div id="tekst"></div>
  <div id="sub"></div>
  <div id="pagina"></div>
  <div id="verder">▼</div>
</div>

<div id="uitroep">BEZWAAR!</div>
<div id="finale"><div id="rol"></div></div>
<div id="gordijn"><div class="doek links"></div><div class="doek rechts"></div><div class="kap"></div></div>
<div id="startscherm" class="pixel"><h1>RAADSZAAL VAN ACHRONA</h1><p>De Raad komt bijeen om de Desync te ontrafelen</p><button id="k-start">▶ Open de zitting</button><p style="font-size:13px;opacity:.7">klik of druk op Enter · met geluid</p></div>
<div id="laden" class="pixel">De Raad wordt bijeengeroepen…</div>

<script type="module" src="/zaal/zaal.js"></script>
</body>
</html>
